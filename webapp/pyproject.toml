# Project manifest — the Python equivalent of Laravel's composer.json.
# Declares metadata + dependencies (with version constraints). Install with:  pip install .

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biodc-web"
version = "0.1.0"
description = "Newcomer-friendly web front-end for BioDC (protein nanowire electron-transfer calculations)."
readme = "README.md"
requires-python = ">=3.10,<3.14"

# Like composer.json's "require": each line is a package + a version constraint.
dependencies = [
    # Web layer
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # BioDC science dependencies
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "tabulate>=0.9",
    "scipy>=1.11",
    # Structure fetching / handling
    "pdb-tools>=2.5",
]

# The app is a couple of flat modules (not a package), so list them explicitly.
[tool.setuptools]
py-modules = ["main", "core"]
